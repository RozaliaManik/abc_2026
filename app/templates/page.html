{% extends "base.html" %}
{% block title %}Игра Поле Чудес{% endblock %}

{% block content %}
<div style="background: white; padding: 30px; border-radius: 12px; max-width: 600px; margin: 20px auto; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
    <h2 style="color: #333366; margin-bottom: 20px;">🎉 Поле Чудес в Браузере 🎉</h2>
    
    <div style="background: #fff3cd; padding: 15px; border-radius: 6px; margin-bottom: 20px; border: 1px solid #ffeeba;">
        <strong>Подсказка к слову:</strong> 
        <p style="margin: 5px 0 0; font-style: italic;">{{ hint }}</p>
    </div>

    <div style="font-size: 36px; font-family: monospace; letter-spacing: 8px; font-weight: bold; background: #eee; padding: 15px; border-radius: 6px; margin-bottom: 25px; color: #333;">
        {{ mask }}
    </div>

    {% if is_won %}
        <div style="background: #d4edda; color: #155724; padding: 15px; border-radius: 8px; font-weight: bold; margin-bottom: 20px;">
            🏆 Поздравляем! Вы победили!
        </div>
        <a href="{{ url_for('page', restart=True) }}" style="display: inline-block; background: #28a745; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold;">Играть снова</a>
    {% else %}
        <form method="GET" action="{{ url_for('page') }}" style="display: flex; justify-content: center; gap: 10px;">
            <input type="text" name="letter" maxlength="1" required style="width: 50px; padding: 10px; font-size: 20px; text-align: center; text-transform: uppercase; border: 2px solid #ced4da; border-radius: 5px;">
            <button type="submit" style="background: #0066cc; color: white; padding: 10px 20px; font-size: 16px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Назвать букву</button>
        </form>
    {% endif %}
</div>
{% endblock %}
